<style>
/* ---------- PAGE SLIDE DOWN ---------- */
body {
  margin: 0;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background-color: #F5E8E0;
  color: #5A5352;
  animation: pageDrop 0.6s ease;
}

@keyframes pageDrop {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- HEADER (FROM ABOUT.HTML) ---------- */
.simple-header {
  position: relative;
  background-color: #E6D7CE;
  padding: 40px 20px 20px;
  text-align: center;
  border-bottom: 2px solid #D8CFC7;
  color: #5A5352;
  letter-spacing: 1px;
}

/* ---------- MOBILE MENU BUTTON ---------- */
.mobile-menu-button {
  position: absolute;
  left: 20px;
  top: 20px;
  cursor: pointer;
}

.hamburger span {
  display: block;
  width: 24px;
  height: 3px;
  background-color: #8F7A68; /* lighter color */
  margin: 4px 0;
  border-radius: 2px;
  transition: transform 0.3s ease, opacity 0.2s ease;
}

/* Hamburger animation */
.hamburger.open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.hamburger.open span:nth-child(2) {
  opacity: 0;
}
.hamburger.open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ---------- DROPDOWN (PUSHES PAGE DOWN) ---------- */
.mobile-dropdown {
  display: flex;
  flex-direction: column;
  background-color: #fbf7f4;
  border: none;
  border-radius: 0 0 4px 4px;
  max-width: 220px;
  position: absolute;
  top: 100%;
  left: 12px;
  margin: 10px 0 20px 12px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.5s ease, opacity 0.35s ease;
  box-shadow: none;
}

.mobile-dropdown.open {
  max-height: 360px;
  opacity: 1;
}

.mobile-dropdown a {
  padding: 14px 18px;
  border-bottom: 1px solid #e4dcd5;
  text-decoration: none;
  color: #6d5a4a;
  font-size:  0.9rem;
}

.mobile-dropdown a:last-child {
  border-bottom: none;
}
  
  .dropdown-parent {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid #e4dcd5;
  cursor: pointer;
  color: #6d5a4a;
  font-size: 0.9rem;
  text-align: left;
}

.chevron {
  transition: transform 0.3s ease;
  font-size: 1.1rem;
  color: #8F7A68;
}

.dropdown-parent.open .chevron {
  transform: rotate(90deg);
}

.submenu {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
  background-color: #faf5f1;
}

.submenu.open {
  max-height: 200px;
}

.submenu a {
  padding-left: 30px;
  font-size: 0.85rem;
  text-align: left;
  display: block;
}

/* ---------- CONTENT ---------- */
.content-container {
  max-width: 900px;
  padding: 20px;
  margin: 40px auto;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
  }
}

.thumb {
  width: 92%;
  max-width: 180px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.thumb:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 14px rgba(0,0,0,0.22);
}

/* ---------- FOOTER ---------- */
footer {
  background: #E6D7CE;
  color: #5A5352;
  text-align: center;
  padding: 20px;
  margin-top: auto;
  font-size: 0.9rem;
  border-top: 2px solid #D8CFC7;
}
  .page-wrapper {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
}
</style>
</head>

 <div class="page-wrapper">

  </div>

</div>
</header>


   
<main>
<div class="content-container">
  <div class="grid">

    <a href="illustration2.html"><img src="images/waiting_joseon_family.png" class="thumb"></a>
    <a href="illustration3.html"><img src="images/temple_magnolia_tree_bloom.png" class="thumb"></a>
    <a href="illustration4.html"><img src="images/10_views_think_celestial.jpg" class="thumb"></a>
    <a href="illustration5.html"><img src="images/hero2.jpg" class="thumb"></a>
    <a href="illustration6.html"><img src="images/Praise_temple.jpg" class="thumb"></a>
    <a href="illustration7.html"><img src="images/Come_unto_me.jpg" class="thumb"></a>
  </div>
</div>
</main>
<footer>© Seoul Korea Temple Art</footer>
   </div>

<script>
function toggleMenu() {
  const dropdown = document.getElementById("dropdownMenu");
  const hamburger = document.querySelector(".hamburger");

  dropdown.classList.toggle("open");
  hamburger.classList.toggle("open");
  }
function toggleSubmenu(el) {
  el.classList.toggle("open");
  const submenu = el.nextElementSibling;
  submenu.classList.toggle("open");
}

</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
</script>

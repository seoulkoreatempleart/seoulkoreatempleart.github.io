body {
  margin: 0;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background-color: #F5E8E0;
  color: #5A5352;
  animation: pageDrop 0.6s ease;
}

@keyframes pageDrop {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.simple-header {
  position: relative;
  background-color: #E6D7CE;
  padding: 40px 20px 20px;
  text-align: center;
  border-bottom: 2px solid #D8CFC7;
  color: #5A5352;
  letter-spacing: 1px;
}

.mobile-menu-button {
  position: absolute;
  left: 20px;
  top: 20px;
  cursor: pointer;
}

.hamburger span {
  display: block;
  width: 24px;
  height: 3px;
  background-color: #8F7A68;
  margin: 4px 0;
  border-radius: 2px;
  transition: transform 0.3s ease, opacity 0.2s ease;
}

.hamburger.open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.hamburger.open span:nth-child(2) {
  opacity: 0;
}
.hamburger.open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

.mobile-dropdown {
  display: flex;
  flex-direction: column;
  background-color: #fbf7f4;
  border: none;
  border-radius: 0 0 4px 4px;
  max-width: 220px;
  position: absolute;
  top: 100%;
  left: 12px;
  margin: 10px 0 20px 12px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.5s ease, opacity 0.35s ease;
  box-shadow: none;
}

.mobile-dropdown.open {
  max-height: 360px;
  opacity: 1;
}

.mobile-dropdown a {
  padding: 14px 18px;
  border-bottom: 1px solid #e4dcd5;
  text-decoration: none;
  color: #6d5a4a;
  font-size: 0.9rem;
  font-weight: 400;
  text-align: left;  /* ← add this */

}

.mobile-dropdown a:last-child {
  border-bottom: none;
}

  .dropdown-parent {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid #e4dcd5;
  cursor: pointer;
  color: #6d5a4a;
  font-size: 0.9rem;
  text-align: left;
}

.chevron {
  transition: transform 0.3s ease;
  font-size: 1.1rem;
  color: #8F7A68;
}

.dropdown-parent.open .chevron {
  transform: rotate(90deg);
}

.submenu {

.submenu.open {

.submenu a {

.thumb:hover {

    function toggleMenu() {
      const dropdown = document.getElementById("dropdownMenu");
      const hamburger = document.querySelector(".hamburger");
      dropdown.classList.toggle("open");
      hamburger.classList.toggle("open");
    }
    function toggleSubmenu(el) {
  el.classList.toggle("open");
  const submenu = el.nextElementSibling;
  submenu.classList.toggle("open");
}
